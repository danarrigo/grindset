name: Build signed Android APK

on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.47.9
      LOCKIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      LOCKIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      LOCKIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Use JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Prepare owner-supplied signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 LOCKIN_KEYSTORE_PASSWORD LOCKIN_KEY_ALIAS LOCKIN_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing configuration: $name. No debug-key fallback is allowed."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lockin-release.jks"
          echo "LOCKIN_KEYSTORE_PATH=$RUNNER_TEMP/lockin-release.jks" >> "$GITHUB_ENV"
      - name: Validate public client configuration
        run: python3 tool/client_config.py "$RUNNER_TEMP/lockin-client-config.json"
      - run: flutter pub get
      - name: Build stable-key ARM64 release
        run: flutter build apk --release --flavor sideload --target-platform android-arm64 --split-per-abi --build-number "$GITHUB_RUN_NUMBER" --dart-define-from-file="$RUNNER_TEMP/lockin-client-config.json"
      - name: Verify APK signing certificate
        shell: bash
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-sideload-release.apk | tee build/app/outputs/flutter-apk/signing-certificate.txt
      - name: Build Google Play bundle
        run: flutter build appbundle --release --flavor play --build-number "$GITHUB_RUN_NUMBER" --dart-define-from-file="$RUNNER_TEMP/lockin-client-config.json"
      # Release assets do not count toward the private repository's artifact
      # storage. The draft is deleted after the release is published.
      - name: Put the signed files on a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-${{ github.run_id }}-signed
        run: |
          cd build/app/outputs
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "CI build $GITHUB_RUN_ID (signed Android)" --notes "Signed build files for run $GITHUB_RUN_ID. Deleted after use." \
            flutter-apk/app-arm64-v8a-sideload-release.apk flutter-apk/signing-certificate.txt bundle/playRelease/app-play-release.aab
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lockin-release.jks" "$RUNNER_TEMP/lockin-client-config.json"
