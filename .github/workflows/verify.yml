name: Verify and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FLUTTER_VERSION: 3.47.9
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  signed-android:
    name: Signed Android (manual)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android-release.yml
    secrets: inherit

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test extension/*.test.js test/site/*.test.mjs

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lockin_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: lockin_test_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: psql -v ON_ERROR_STOP=1 -f test/sql/bootstrap.sql
      - run: for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
      - run: psql -v ON_ERROR_STOP=1 -f test/sql/shared_state.sql
      - run: psql -v ON_ERROR_STOP=1 -f test/sql/delete_account.sql
      - run: psql -v ON_ERROR_STOP=1 -f test/sql/focus_hours.sql
      - run: psql -v ON_ERROR_STOP=1 -f test/sql/strict_mode.sql

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Use JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Prepare public client configuration
        run: python3 tool/client_config.py "$RUNNER_TEMP/lockin-client-config.json"
      - run: flutter build apk --debug --flavor sideload --target-platform android-arm64,android-x64 --split-per-abi --dart-define-from-file="$RUNNER_TEMP/lockin-client-config.json"
      - name: Build the Google Play edition
        run: flutter build apk --debug --flavor play --target-platform android-arm64,android-x64 --dart-define-from-file="$RUNNER_TEMP/lockin-client-config.json"
      - name: Verify release signing fails closed without owner keys
        shell: bash
        run: |
          if ./android/gradlew -p android :app:assembleRelease --dry-run > "$RUNNER_TEMP/signing-check.log" 2>&1; then
            echo '::error::A release must not silently use debug signing.'
            exit 1
          fi
          grep -q 'Debug keys are never used for a release' "$RUNNER_TEMP/signing-check.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grindset-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-arm64-v8a-sideload-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grindset-android-x64-debug
          path: build/app/outputs/flutter-apk/app-x86_64-sideload-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grindset-android-play-arm64-debug
          path: build/app/outputs/flutter-apk/app-play-debug.apk
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare public client configuration
        shell: pwsh
        run: python tool/client_config.py "$env:RUNNER_TEMP/lockin-client-config.json"
      - run: flutter build windows --release --dart-define-from-file="$env:RUNNER_TEMP/lockin-client-config.json"
      - name: Verify native startup and close-to-tray behavior
        shell: pwsh
        run: ./test/native/windows_startup_test.ps1 -ExecutablePath ./build/windows/x64/runner/Release/lockin.exe
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          ./tool/package_windows.ps1
      - name: Verify installer and installed application
        shell: pwsh
        run: ./test/native/windows_installer_test.ps1 -InstallerPath (Get-ChildItem ./build/installers/*-setup.exe).FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grindset-windows-unsigned
          path: build/windows/x64/runner/Release/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grindset-windows-installer-unsigned
          path: build/installers/*-setup.exe
          retention-days: 7
