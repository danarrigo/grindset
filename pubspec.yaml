name: lockin
description: A local-first focus and activity tracker for Windows and Android.
publish_to: none
version: 1.6.14+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.35.4
  sqlite3: ^3.9.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_local_notifications: ^23.0.1
  supabase_flutter: ^2.18.3
  win32: ^5.15.0
  ffi: ^2.2.0
  window_manager: ^0.5.1
  tray_manager: ^0.5.1
  launch_at_startup: ^0.5.1
  file_selector: ^1.1.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
